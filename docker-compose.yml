version: "3.9"

# =============================================================================
# CTFacile — Full Stack Compose
# =============================================================================
# Services:
#   traefik      — reverse proxy, auto-routes challenge containers via labels
#   db           — PostgreSQL persistent store
#   redis        — broker + cache + telemetry
#   web          — Django / gunicorn (stateless, scalable)
#   celery       — async task worker (flag events, docker operations)
#   celery-beat  — periodic scheduler (sweeps expired containers every minute)
#
# Networks:
#   traefik_public  — shared with spawned challenge containers so Traefik can
#                     see and route them without exposing their ports directly
#   backend         — internal service mesh (web <-> db <-> redis)
# =============================================================================

services:

  # ---------------------------------------------------------------------------
  # Traefik — Reverse Proxy & Dynamic Router
  # ---------------------------------------------------------------------------
  traefik:
    image: traefik:v2.11
    container_name: ctfacile_traefik
    restart: unless-stopped
    command:
      - "--api.insecure=true"
      - "--providers.docker=true"
      - "--providers.docker.exposedbydefault=false"
      - "--providers.docker.network=ctfacile_traefik_public"
      - "--entrypoints.web.address=:80"
      - "--entrypoints.websecure.address=:443"
      - "--log.level=INFO"
    ports:
      - "80:80"
      - "443:443"
      - "8080:8080"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    networks:
      - traefik_public
      - backend

  # ---------------------------------------------------------------------------
  # PostgreSQL — Persistent Relational Store (Strict 3NF)
  # ---------------------------------------------------------------------------
  db:
    image: postgres:16-alpine
    container_name: ctfacile_db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-ctfacile}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-ctfacilepassword}
      POSTGRES_DB: ${POSTGRES_DB:-ctfacile_db}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - backend
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-ctfacile} -d ${POSTGRES_DB:-ctfacile_db}"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ---------------------------------------------------------------------------
  # Redis — Broker + Cache + Telemetry Engine
  # ---------------------------------------------------------------------------
  redis:
    image: redis:7-alpine
    container_name: ctfacile_redis
    restart: unless-stopped
    command: redis-server --appendonly yes --maxmemory 256mb --maxmemory-policy allkeys-lru
    volumes:
      - redis_data:/data
    networks:
      - backend
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ---------------------------------------------------------------------------
  # Django Web — Stateless Application Server
  # ---------------------------------------------------------------------------
  web:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: ctfacile_web
    restart: unless-stopped
    command: |
      sh -c "python manage.py migrate --noinput && python manage.py collectstatic --noinput && gunicorn config.wsgi:application --bind 0.0.0.0:8000 --workers 4 --timeout 120 --access-logfile -"
    environment:
      SECRET_KEY: ${SECRET_KEY}
      DEBUG: ${DEBUG:-0}
      DATABASE_URL: postgres://${POSTGRES_USER:-ctfacile}:${POSTGRES_PASSWORD:-ctfacilepassword}@db:5432/${POSTGRES_DB:-ctfacile_db}
      REDIS_URL: redis://redis:6379/0
      CELERY_BROKER_URL: redis://redis:6379/1
      ALLOWED_HOSTS: ${ALLOWED_HOSTS:-localhost,127.0.0.1,ctfacile.local}
      CTF_HOST_IP: ${CTF_HOST_IP:-127.0.0.1}
      TRAEFIK_NETWORK_NAME: ctfacile_traefik_public
    volumes:
      - .:/app                                   # live-mount source → template/code changes instant
      - /var/run/docker.sock:/var/run/docker.sock
      - static_files:/app/staticfiles
      - media_files:/app/media
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - backend
      - traefik_public
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.web.rule=Host(`${CTF_DOMAIN:-ctfacile.local}`)"
      - "traefik.http.routers.web.entrypoints=web"
      - "traefik.http.services.web.loadbalancer.server.port=8000"

  # ---------------------------------------------------------------------------
  # Celery Worker — Async Task Executor
  # ---------------------------------------------------------------------------
  celery:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: ctfacile_celery
    restart: unless-stopped
    command: celery -A config worker --loglevel=info --concurrency=4
    environment:
      SECRET_KEY: ${SECRET_KEY}
      DEBUG: ${DEBUG:-0}
      DATABASE_URL: postgres://${POSTGRES_USER:-ctfacile}:${POSTGRES_PASSWORD:-ctfacilepassword}@db:5432/${POSTGRES_DB:-ctfacile_db}
      REDIS_URL: redis://redis:6379/0
      CELERY_BROKER_URL: redis://redis:6379/1
      CTF_HOST_IP: ${CTF_HOST_IP:-127.0.0.1}
      TRAEFIK_NETWORK_NAME: ctfacile_traefik_public
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - backend

  # ---------------------------------------------------------------------------
  # Celery Beat — Periodic Scheduler ("Cockroach Protocol" sweeper)
  # ---------------------------------------------------------------------------
  celery-beat:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: ctfacile_celery_beat
    restart: unless-stopped
    command: celery -A config beat --loglevel=info --scheduler celery.beat.PersistentScheduler
    environment:
      SECRET_KEY: ${SECRET_KEY}
      DEBUG: ${DEBUG:-0}
      DATABASE_URL: postgres://${POSTGRES_USER:-ctfacile}:${POSTGRES_PASSWORD:-ctfacilepassword}@db:5432/${POSTGRES_DB:-ctfacile_db}
      REDIS_URL: redis://redis:6379/0
      CELERY_BROKER_URL: redis://redis:6379/1
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - backend

# =============================================================================
# Networks
# =============================================================================
networks:
  # Shared with dynamically-spawned challenge containers.
  # Name must match DEFAULT_TRAEFIK_NETWORK in constants.py and TRAEFIK_NETWORK_NAME env var.
  traefik_public:
    name: ctfacile_traefik_public
    driver: bridge

  # Internal service mesh — not reachable from outside.
  backend:
    driver: bridge

# =============================================================================
# Volumes
# =============================================================================
volumes:
  postgres_data:
  redis_data:
  static_files:
  media_files:
