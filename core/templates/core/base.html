<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CTFacile | Dashboard</title>
    <!-- HTMX -->
    <script src="https://unpkg.com/htmx.org@1.9.10"></script>
    <!-- Alpine JS -->
    <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.x.x/dist/cdn.min.js"></script>
    <!-- Custom HTMX Security Interceptor -->
    {% load static %}
    <script src="{% static 'js/htmx_config.js' %}" defer></script>
    <!-- Inter UI Font -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
    
    <style>
        :root {
            --bg-color: #0f172a;
            --surface-color: #1e293b;
            --text-primary: #f8fafc;
            --text-secondary: #94a3b8;
            --accent-primary: #3b82f6;
            --accent-danger: #ef4444;
            --accent-success: #22c55e;
            --border-color: #334155;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Inter', sans-serif;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-primary);
            line-height: 1.6;
        }

        /* The State-Reacting Banner */
        .offline-banner {
            background: var(--accent-danger);
            color: white;
            text-align: center;
            padding: 0.75rem;
            font-weight: 600;
            position: sticky;
            top: 0;
            z-index: 50;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 2rem;
        }
        
        button {
            background-color: var(--accent-primary);
            color: white;
            border: none;
            padding: 0.5rem 1rem;
            border-radius: 4px;
            cursor: pointer;
            font-weight: 600;
            transition: background-color 0.2s;
        }

        button:hover {
            background-color: #2563eb;
        }
    </style>
</head>
<!-- Global State Manager -->
<body 
    x-data="{ 
        isOffline: false, 
        modalOpen: false, 
        currentChallenge: null,
        
        init() {
            // Heartbeat Protocol - Fires every 15 seconds
            setInterval(async () => {
                try {
                    const response = await fetch('/health/ping/');
                    if (response.ok) {
                        this.isOffline = false;
                    } else {
                        this.isOffline = true;
                    }
                } catch (error) {
                    this.isOffline = true;
                }
            }, 15000);
        }
    }"
>

    <!-- Cockroach Protocol Banner -->
    <div 
        class="offline-banner" 
        x-show="isOffline" 
        x-transition.opacity 
        style="display: none;"
    >
        ⚠️ Connection Lost. Entering Offline Mode. Local drafts are securely cached.
    </div>

    <!-- CSRF Token setup for Django's expected name -->
    <form style="display:none">
        {% csrf_token %}
    </form>

    <div class="container">
        {% block content %}{% endblock %}
    </div>

</body>
</html>
