{% extends "core/base.html" %}

{% block content %}
<div class="min-h-[70vh] flex flex-col justify-center items-center">

    <div class="bg-brand-surface border border-gray-700 p-10 rounded-2xl shadow-2xl max-w-md w-full">
        <h2 class="text-3xl font-black mb-2 text-center text-white">SYSTEM_LOGIN</h2>
        <p class="text-center text-gray-400 text-sm mb-8 font-mono">Authenticate to access the skill tree</p>

        <form method="post" class="space-y-6">
            {% csrf_token %}

            {% if form.errors %}
            <div class="p-3 bg-brand-danger/20 border border-brand-danger text-brand-danger rounded text-sm mb-4">
                Invalid credentials. Access denied.
            </div>
            {% endif %}

            <div>
                <label class="block text-xs uppercase tracking-wider text-gray-400 mb-2 font-mono">Username</label>
                {{ form.username }}
                <!-- We apply Tailwind classes directly if we can, or just style inputs globally in base. Here we expect standard widget rendering -> we'll style input tags globally via CSS if needed, but for now standard blocks -->
                <style>
                    input[type="text"],
                    input[type="password"] {
                        width: 100%;
                        padding: 0.75rem;
                        background: #0f172a;
                        border: 1px solid #334155;
                        border-radius: 0.5rem;
                        color: white;
                    }

                    input:focus {
                        outline: 2px solid #3b82f6;
                        border-color: transparent;
                    }
                </style>
            </div>

            <div>
                <label class="block text-xs uppercase tracking-wider text-gray-400 mb-2 font-mono">Password</label>
                {{ form.password }}
            </div>

            <button type="submit"
                class="w-full bg-brand-accent hover:bg-blue-600 text-white font-bold py-3 px-4 rounded transition-all shadow-lg active:scale-95">
                INITIALIZE_SESSION
            </button>
        </form>
    </div>

</div>
{% endblock %}
