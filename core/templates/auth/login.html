{% extends "core/base.html" %}

{% block content %}
<div class="min-h-[70vh] flex flex-col justify-center items-center">

    <div class="border border-gray-800/60 rounded-xl p-8 w-full max-w-sm bg-gray-900/30">

        <!-- Header -->
        <div class="mb-7 text-center">
            <h2 class="text-xl font-bold text-white mb-1">Sign in</h2>
            <p class="text-xs text-gray-500 font-mono">Authenticate to access the skill tree</p>
        </div>

        {% if form.errors %}
        <div class="mb-5 p-3 bg-red-950/30 border border-red-800/50 text-red-300 text-sm rounded-lg text-center">
            Invalid credentials. Access denied.
        </div>
        {% endif %}

        <form method="post" class="space-y-4">
            {% csrf_token %}

            <div>
                <label class="block text-xs font-medium text-gray-400 mb-1.5 uppercase tracking-wider">Username</label>
                <input type="text" name="username" required autofocus
                       class="w-full bg-gray-900/60 border border-gray-700/60 rounded-lg px-3 py-2.5 text-white text-sm focus:outline-none focus:border-brand-accent/60 focus:ring-1 focus:ring-brand-accent/30 transition font-mono">
            </div>

            <div>
                <label class="block text-xs font-medium text-gray-400 mb-1.5 uppercase tracking-wider">Password</label>
                <input type="password" name="password" required
                       class="w-full bg-gray-900/60 border border-gray-700/60 rounded-lg px-3 py-2.5 text-white text-sm focus:outline-none focus:border-brand-accent/60 focus:ring-1 focus:ring-brand-accent/30 transition font-mono">
            </div>

            <button type="submit"
                    class="w-full inline-flex items-center justify-center px-4 py-2.5 text-sm font-semibold text-white bg-brand-accent hover:bg-blue-600 rounded-lg transition-all active:scale-[0.99]">
                Sign In
            </button>
        </form>

    </div>

</div>
{% endblock %}
