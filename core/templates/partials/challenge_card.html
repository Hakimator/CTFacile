{% load static %}
<div hx-get="{% url 'challenge_detail' challenge.id %}"
     hx-target="#challenge-modal-content"
     hx-swap="innerHTML"
     @click="modalOpen = true"
     class="relative border border-gray-700/60 bg-gray-900/40 rounded-xl p-5 cursor-pointer hover:border-brand-accent/50 hover:bg-gray-900/60 transition-all group flex flex-col justify-between min-h-[110px]">

    <div>
        <div class="flex items-start justify-between gap-2 mb-2">
            <h4 class="text-sm font-semibold text-gray-100 group-hover:text-white transition truncate leading-tight">{{ challenge.title }}</h4>
            <span class="flex-shrink-0 text-xs font-mono font-semibold text-gray-400 bg-white/5 border border-white/8 px-2 py-0.5 rounded">{{ challenge.base_points }}</span>
        </div>

        <div class="flex flex-wrap gap-1.5">
            {% if challenge.docker_image_tag %}
            <span class="inline-flex items-center gap-1 px-1.5 py-0.5 text-xs font-medium text-blue-400/70 bg-blue-950/30 border border-blue-900/40 rounded">
                <svg width="9" height="9" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
                    <rect width="20" height="8" x="2" y="2" rx="2"/><rect width="20" height="8" x="2" y="14" rx="2"/>
                </svg>
                Container
            </span>
            {% endif %}
        </div>
    </div>

    <div class="flex items-center justify-between mt-4">
        <span class="text-xs text-gray-600 font-mono">Click to open</span>
        <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" class="text-gray-600 group-hover:text-brand-accent group-hover:translate-x-0.5 transition-all">
            <path d="m9 18 6-6-6-6"/>
        </svg>
    </div>
</div>
